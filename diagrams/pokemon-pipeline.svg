<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 240" role="img" aria-labelledby="pokemon-diagram-1-diagram-title pokemon-diagram-1-diagram-desc" font-family="Noto Sans KR, Arial, sans-serif"><title id="pokemon-diagram-1-diagram-title">2389의 세 단계 판단과 경로 실행</title><desc id="pokemon-diagram-1-diagram-desc">상위·중간 계획은 생성 모델, 정책 선택은 Jev가 맡는다. 게임 RAM의 관측은 각 층의 판단과 목표 완료 확인에 사용된다.</desc><rect width="920" height="240" fill="#fafaf8"/><defs><marker id="pokemon-diagram-1-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#696961"/></marker></defs><path d="M210 97 H245" fill="none" stroke="#696961" stroke-width="1.5" marker-end="url(#pokemon-diagram-1-arrow)"/><path d="M440 97 H475" fill="none" stroke="#696961" stroke-width="1.5" marker-end="url(#pokemon-diagram-1-arrow)"/><path d="M670 97 H705" fill="none" stroke="#696961" stroke-width="1.5" marker-end="url(#pokemon-diagram-1-arrow)"/><path d="M805 139 V195 H115 V144" fill="none" stroke="#777" stroke-dasharray="5 4" marker-end="url(#pokemon-diagram-1-arrow)"/><text x="394" y="184" font-size="11" fill="#666">실행 후 다시 관측</text><g><rect x="20" y="55" width="190" height="84" fill="#e3dfed" stroke="#e3dfed"/><text x="34" y="72" font-size="9" letter-spacing="1" fill="#756688">GENERATIVE MODEL</text><text x="34" y="94" font-size="15" font-weight="700" fill="#3b3056">상위 계획 · GLM</text><text x="34" y="114" font-size="11" fill="#756688">퀘스트 · 완료 조건</text></g><g><rect x="250" y="55" width="190" height="84" fill="#e3dfed" stroke="#e3dfed"/><text x="264" y="72" font-size="9" letter-spacing="1" fill="#756688">GENERATIVE MODEL</text><text x="264" y="94" font-size="15" font-weight="700" fill="#3b3056">중간 계획 · DeepSeek</text><text x="264" y="114" font-size="11" fill="#756688">현재 목표 좌표 x, y</text></g><g><rect x="480" y="55" width="190" height="84" fill="#e33b27" stroke="#e33b27"/><text x="494" y="72" font-size="9" letter-spacing="1" fill="#ffe4de">DECISION MODEL</text><text x="494" y="94" font-size="15" font-weight="700" fill="#fff">Jev · 정책 선택</text><text x="494" y="114" font-size="11" fill="#ffe4de">최단 · 풀밭 회피 · 훈련</text></g><g><rect x="710" y="55" width="190" height="84" fill="#efefec" stroke="#c5c5bf"/><text x="724" y="72" font-size="9" letter-spacing="1" fill="#686864">코드</text><text x="724" y="94" font-size="15" font-weight="700" fill="#202020">가중 경로 탐색</text><text x="724" y="114" font-size="11" fill="#686864">지형 비용 → 다음 방향</text></g></svg>