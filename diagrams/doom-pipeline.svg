<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 240" role="img" aria-labelledby="doom-diagram-1-diagram-title doom-diagram-1-diagram-desc" font-family="Noto Sans KR, Arial, sans-serif"><title id="doom-diagram-1-diagram-title">게임 상태를 보내고 다음 조작을 받는 과정</title><desc id="doom-diagram-1-diagram-desc">게임 코드가 상태와 지시를 Jev에 보내고, 받은 판단을 조작으로 실행한다. 이동한 뒤 상태를 다시 확인한다.</desc><rect width="920" height="240" fill="#fafaf8"/><defs><marker id="doom-diagram-1-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#696961"/></marker></defs><path d="M210 97 H245" fill="none" stroke="#696961" stroke-width="1.5" marker-end="url(#doom-diagram-1-arrow)"/><path d="M440 97 H475" fill="none" stroke="#696961" stroke-width="1.5" marker-end="url(#doom-diagram-1-arrow)"/><path d="M670 97 H705" fill="none" stroke="#696961" stroke-width="1.5" marker-end="url(#doom-diagram-1-arrow)"/><path d="M805 139 V195 H115 V144" fill="none" stroke="#777" stroke-dasharray="5 4" marker-end="url(#doom-diagram-1-arrow)"/><text x="394" y="184" font-size="11" fill="#666">실행 후 다시 관측</text><g><rect x="20" y="55" width="190" height="84" fill="#202020" stroke="#202020"/><text x="34" y="72" font-size="9" letter-spacing="1" fill="#ccc">환경</text><text x="34" y="94" font-size="15" font-weight="700" fill="#fff">게임의 현재 상태</text><text x="34" y="114" font-size="11" fill="#ccc">구조화된 상태 · 텍스트</text></g><g><rect x="250" y="55" width="190" height="84" fill="#efefec" stroke="#c5c5bf"/><text x="264" y="72" font-size="9" letter-spacing="1" fill="#686864">코드</text><text x="264" y="94" font-size="15" font-weight="700" fill="#202020">상태와 지시 연결</text><text x="264" y="114" font-size="11" fill="#686864">현재 무엇을 우선할지</text></g><g><rect x="480" y="55" width="190" height="84" fill="#e33b27" stroke="#e33b27"/><text x="494" y="72" font-size="9" letter-spacing="1" fill="#ffe4de">DECISION MODEL</text><text x="494" y="94" font-size="15" font-weight="700" fill="#fff">Jev 판단</text><text x="494" y="114" font-size="11" fill="#ffe4de">발사 여부 · 목표 · 회피 필요성</text></g><g><rect x="710" y="55" width="190" height="84" fill="#efefec" stroke="#c5c5bf"/><text x="724" y="72" font-size="9" letter-spacing="1" fill="#686864">코드</text><text x="724" y="94" font-size="15" font-weight="700" fill="#202020">게임 조작</text><text x="724" y="114" font-size="11" fill="#686864">다음 상태로 변화</text></g></svg>