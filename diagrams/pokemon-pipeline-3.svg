<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 240" role="img" aria-labelledby="pokemon-diagram-3-diagram-title pokemon-diagram-3-diagram-desc" font-family="Noto Sans KR, Arial, sans-serif"><title id="pokemon-diagram-3-diagram-title">저장된 기억과 현재 상황이 다음 행동으로 이어지는 과정</title><desc id="pokemon-diagram-3-diagram-desc">매 요청마다 현재 상태와 기억 일부를 조합한다. 모델의 선택을 실행한 뒤 생긴 대화와 행동 기록은 다음 요청의 재료가 된다. 파일 저장은 이 기억과 게임 상태를 재시작 뒤에도 이어 쓰게 한다.</desc><rect width="920" height="240" fill="#fafaf8"/><defs><marker id="pokemon-diagram-3-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#696961"/></marker></defs><path d="M210 97 H245" fill="none" stroke="#696961" stroke-width="1.5" marker-end="url(#pokemon-diagram-3-arrow)"/><path d="M440 97 H475" fill="none" stroke="#696961" stroke-width="1.5" marker-end="url(#pokemon-diagram-3-arrow)"/><path d="M670 97 H705" fill="none" stroke="#696961" stroke-width="1.5" marker-end="url(#pokemon-diagram-3-arrow)"/><path d="M805 139 V195 H115 V144" fill="none" stroke="#777" stroke-dasharray="5 4" marker-end="url(#pokemon-diagram-3-arrow)"/><text x="394" y="184" font-size="11" fill="#666">실행 후 다시 관측</text><g><rect x="20" y="55" width="190" height="84" fill="#202020" stroke="#202020"/><text x="34" y="72" font-size="9" letter-spacing="1" fill="#ccc">환경</text><text x="34" y="94" font-size="15" font-weight="700" fill="#fff">현재 게임 + 기억</text><text x="34" y="114" font-size="11" fill="#ccc">상태 관측 · memory.json</text></g><g><rect x="250" y="55" width="190" height="84" fill="#efefec" stroke="#c5c5bf"/><text x="264" y="72" font-size="9" letter-spacing="1" fill="#686864">코드</text><text x="264" y="94" font-size="15" font-weight="700" fill="#202020">상황과 후보 구성</text><text x="264" y="114" font-size="11" fill="#686864">최근 대화·행동 · 선택지 설명</text></g><g><rect x="480" y="55" width="190" height="84" fill="#e3dfed" stroke="#e3dfed"/><text x="494" y="72" font-size="9" letter-spacing="1" fill="#756688">GENERATIVE MODEL</text><text x="494" y="94" font-size="15" font-weight="700" fill="#3b3056">Qwen 3.5 9B</text><text x="494" y="114" font-size="11" fill="#756688">Ollama · 후보 이름 하나 반환</text></g><g><rect x="710" y="55" width="190" height="84" fill="#efefec" stroke="#c5c5bf"/><text x="724" y="72" font-size="9" letter-spacing="1" fill="#686864">코드</text><text x="724" y="94" font-size="15" font-weight="700" fill="#202020">선택 실행 · 기억 갱신</text><text x="724" y="114" font-size="11" fill="#686864">이동·전투 · 대화·행동 기록</text></g></svg>