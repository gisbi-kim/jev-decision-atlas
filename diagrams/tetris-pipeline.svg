<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 240" role="img" aria-labelledby="tetris-diagram-1-diagram-title tetris-diagram-1-diagram-desc" font-family="Noto Sans KR, Arial, sans-serif"><title id="tetris-diagram-1-diagram-title">배치 결과를 계산한 다음 우선순위를 판단하기</title><desc id="tetris-diagram-1-diagram-desc">public/tetris.js가 결과를 계산하고 public/jev.js가 설명과 질문을 만든다.</desc><rect width="920" height="240" fill="#fafaf8"/><defs><marker id="tetris-diagram-1-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#696961"/></marker></defs><path d="M210 97 H245" fill="none" stroke="#696961" stroke-width="1.5" marker-end="url(#tetris-diagram-1-arrow)"/><path d="M440 97 H475" fill="none" stroke="#696961" stroke-width="1.5" marker-end="url(#tetris-diagram-1-arrow)"/><path d="M670 97 H705" fill="none" stroke="#696961" stroke-width="1.5" marker-end="url(#tetris-diagram-1-arrow)"/><path d="M805 139 V195 H115 V144" fill="none" stroke="#777" stroke-dasharray="5 4" marker-end="url(#tetris-diagram-1-arrow)"/><text x="394" y="184" font-size="11" fill="#666">실행 후 다시 관측</text><g><rect x="20" y="55" width="190" height="84" fill="#202020" stroke="#202020"/><text x="34" y="72" font-size="9" letter-spacing="1" fill="#ccc">환경</text><text x="34" y="94" font-size="15" font-weight="700" fill="#fff">현재 보드와 블록</text><text x="34" y="114" font-size="11" fill="#ccc">현재 블록 · 다음 블록</text></g><g><rect x="250" y="55" width="190" height="84" fill="#efefec" stroke="#c5c5bf"/><text x="264" y="72" font-size="9" letter-spacing="1" fill="#686864">코드</text><text x="264" y="94" font-size="15" font-weight="700" fill="#202020">배치별 미래 보드</text><text x="264" y="114" font-size="11" fill="#686864">줄 · 구멍 · 높이 · 표면</text></g><g><rect x="480" y="55" width="190" height="84" fill="#e33b27" stroke="#e33b27"/><text x="494" y="72" font-size="9" letter-spacing="1" fill="#ffe4de">DECISION MODEL</text><text x="494" y="94" font-size="15" font-weight="700" fill="#fff">placement Choice</text><text x="494" y="114" font-size="11" fill="#ffe4de">후보 ID와 확률</text></g><g><rect x="710" y="55" width="190" height="84" fill="#efefec" stroke="#c5c5bf"/><text x="724" y="72" font-size="9" letter-spacing="1" fill="#686864">코드</text><text x="724" y="94" font-size="15" font-weight="700" fill="#202020">선택한 배치 실행</text><text x="724" y="114" font-size="11" fill="#686864">열 · 회전 · hard drop</text></g></svg>