t="700" fill="#fff">Jev의 세 판단</text><text x="494" y="114" font-size="11" fill="#ffe4de">행동 · 점프 필요 · 위험</text></g><g><rect x="710" y="55" width="190" height="84" fill="#efefec" stroke="#c5c5bf"/><text x="724" y="72" font-size="9" letter-spacing="1" fill="#686864">코드</text><text x="724" y="94" font-size="15" font-weight="700" fill="#202020">컨트롤러 매크로</text><text x="724" y="114" font-size="11" fill="#686864">선택한 조작을 여러 프레임 유지</text></g></svg>