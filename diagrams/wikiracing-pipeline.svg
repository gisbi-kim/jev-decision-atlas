<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 240" role="img" aria-labelledby="wikiracing-diagram-1-diagram-title wikiracing-diagram-1-diagram-desc" font-family="Noto Sans KR, Arial, sans-serif"><title id="wikiracing-diagram-1-diagram-title">링크 후보를 평가하고 실제 이동 하나를 고르기</title><desc id="wikiracing-diagram-1-diagram-desc">먼저 링크들을 평가하고, 후보를 줄여 다음에 누를 링크를 고른다. 이동한 페이지에서도 링크를 새로 모아 같은 절차를 반복한다.</desc><rect width="920" height="240" fill="#fafaf8"/><defs><marker id="wikiracing-diagram-1-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#696961"/></marker></defs><path d="M210 97 H245" fill="none" stroke="#696961" stroke-width="1.5" marker-end="url(#wikiracing-diagram-1-arrow)"/><path d="M440 97 H475" fill="none" stroke="#696961" stroke-width="1.5" marker-end="url(#wikiracing-diagram-1-arrow)"/><path d="M670 97 H705" fill="none" stroke="#696961" stroke-width="1.5" marker-end="url(#wikiracing-diagram-1-arrow)"/><path d="M805 139 V195 H115 V144" fill="none" stroke="#777" stroke-dasharray="5 4" marker-end="url(#wikiracing-diagram-1-arrow)"/><text x="394" y="184" font-size="11" fill="#666">실행 후 다시 관측</text><g><rect x="20" y="55" width="190" height="84" fill="#202020" stroke="#202020"/><text x="34" y="72" font-size="9" letter-spacing="1" fill="#ccc">환경</text><text x="34" y="94" font-size="15" font-weight="700" fill="#fff">현재 문서</text><text x="34" y="114" font-size="11" fill="#ccc">현재 링크 · 목표 문서</text></g><g><rect x="250" y="55" width="190" height="84" fill="#e33b27" stroke="#e33b27"/><text x="264" y="72" font-size="9" letter-spacing="1" fill="#ffe4de">DECISION MODEL</text><text x="264" y="94" font-size="15" font-weight="700" fill="#fff">후보별 평가</text><text x="264" y="114" font-size="11" fill="#ffe4de">목표에 이르는 관련성</text></g><g><rect x="480" y="55" width="190" height="84" fill="#e33b27" stroke="#e33b27"/><text x="494" y="72" font-size="9" letter-spacing="1" fill="#ffe4de">DECISION MODEL</text><text x="494" y="94" font-size="15" font-weight="700" fill="#fff">명시적인 선택</text><text x="494" y="114" font-size="11" fill="#ffe4de">다음 링크 하나</text></g><g><rect x="710" y="55" width="190" height="84" fill="#efefec" stroke="#c5c5bf"/><text x="724" y="72" font-size="9" letter-spacing="1" fill="#686864">코드</text><text x="724" y="94" font-size="15" font-weight="700" fill="#202020">문서 이동</text><text x="724" y="114" font-size="11" fill="#686864">새 페이지의 링크를 읽음</text></g></svg>