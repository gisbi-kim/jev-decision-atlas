터 사용</text></g><g><rect x="618" y="906" width="82" height="24" fill="#fafaf8" stroke="#55725a" stroke-dasharray="3 2"/><text x="659" y="922" text-anchor="middle" font-size="9.5" font-weight="500" fill="#34583c">새 층 학습</text></g><text x="720" y="915" font-size="10.5" font-weight="700" fill="#555">완성 모델 사용: 불필요</text><text x="720" y="931" font-size="10.5" font-weight="400" fill="#555">직접 추가 학습 시: 필요</text></g><path d="M20 957 H900" stroke="#c5c5bf"/><g><rect x="20" y="975" width="65" height="24" fill="#efefec" stroke="#c5c5bf" /><text x="52.5" y="991" text-anchor="middle" font-size="9.5" font-weight="500" fill="#555">고정</text></g><g><rect x="100" y="975" width="65" height="24" fill="#dce8dc" stroke="#55725a" /><text x="132.5" y="991" text-anchor="middle" font-size="9.5" font-weight="500" fill="#34583c">학습</text></g><g><rect x="180" y="975" width="85" height="24" fill="#fafaf8" stroke="#55725a" stroke-dasharray="3 2"/><text x="222.5" y="991" text-anchor="middle" font-size="9.5" font-weight="500" fill="#34583c">선택 학습</text></g><text x="282" y="991" font-size="10" fill="#666">고정 = 가중치 유지 · 학습 = 가중치 갱신 · 선택 = 직접 추가 학습할 때만</text><text x="20" y="1020" font-size="10" fill="#777">③은 실제 MNIST 설정이다. 다른 행은 대표적인 사용·학습 예이며 모든 제품의 필수 학습법을 뜻하지 않는다.</text><text x="20" y="1038" font-size="10" fill="#777">상자 색은 연산 역할을 표시한다. 학습데이터가 불필요한 경우에도 실제 문제의 성능 평가는 필요하다.</text></svg>