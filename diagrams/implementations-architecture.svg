 · Kanana</text><path d="M320 630 H335" fill="none" stroke="#696961" stroke-width="1.5" marker-end="url(#implementations-architecture-1-arrow)"/><path d="M510 630 H525" fill="none" stroke="#696961" stroke-width="1.5" marker-end="url(#implementations-architecture-1-arrow)"/><path d="M320 678 H335" fill="none" stroke="#696961" stroke-width="1.5" marker-end="url(#implementations-architecture-1-arrow)"/><path d="M510 678 H525" fill="none" stroke="#696961" stroke-width="1.5" marker-end="url(#implementations-architecture-1-arrow)"/><path d="M700 654 H715" fill="none" stroke="#696961" stroke-width="1.5" marker-end="url(#implementations-architecture-1-arrow)"/><g><rect x="150" y="612" width="170" height="36" fill="#202020" stroke="#202020"/><text x="162" y="635" font-size="12" font-weight="500" fill="#fff">상태 + 질문</text></g><g><rect x="150" y="660" width="170" height="36" fill="#202020" stroke="#202020"/><text x="162" y="683" font-size="12" font-weight="500" fill="#fff">후보 각각</text></g><g><rect x="340" y="612" width="170" height="36" fill="#e3dfed" stroke="#e3dfed"/><text x="352" y="635" font-size="12" font-weight="500" fill="#3b3056">상태·질문 → 벡터 u</text></g><g><rect x="340" y="660" width="170" height="36" fill="#e3dfed" stroke="#e3dfed"/><text x="352" y="683" font-size="12" font-weight="500" fill="#3b3056">후보 각각 → 벡터 v</text></g><g><rect x="530" y="612" width="170" height="84" fill="#e33b27" stroke="#e33b27"/><text x="542" y="629" font-size="8" letter-spacing=".8" fill="#ffe4de">HEAD / READOUT</text><text x="542" y="651" font-size="14" font-weight="700" fill="#fff">임베딩 유사도</text><text x="542" y="671" font-size="10.5" fill="#ffe4de">선택적 projection 후</text><text x="542" y="685" font-size="10.5" fill="#ffe4de">cosine similarity</text></g><g><rect x="720" y="612" width="170" height="84" fill="#efefec" stroke="#c5c5bf"/><text x="732" y="629" font-size="8" letter-spacing=".8" fill="#686864">OUTPUT</text><text x="732" y="651" font-size="14" font-weight="700" fill="#202020">후보 확률 · 선택</text><text x="732" y="671" font-size="10.5" fill="#686864">유사도 → softmax</text><text x="732" y="685" font-size="10.5" fill="#686864">후보 벡터 재사용 가능</text></g></g><path d="M20 724 H900" stroke="#c5c5bf"/><rect x="20" y="745" width="10" height="10" fill="#e3dfed"/><text x="37" y="754" font-size="10" fill="#666">언어 backbone</text><rect x="153" y="745" width="10" height="10" fill="#dce8ec"/><text x="170" y="754" font-size="10" fill="#666">양방향 encoder</text><rect x="300" y="745" width="10" height="10" fill="#e33b27"/><text x="317" y="754" font-size="10" fill="#666">후보 점수 계산</text><rect x="443" y="745" width="10" height="10" fill="#efefec" stroke="#c5c5bf"/><text x="460" y="754" font-size="10" fill="#666">기존 층 · 생성 · 후처리</text><text x="20" y="781" font-size="10" fill="#777">색은 연산 역할을 표시한다. 가중치 고정·LoRA·head 학습·전체 학습 여부는 별도로 비교한다.</text></svg>