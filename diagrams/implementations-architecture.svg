<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 802" role="img" aria-labelledby="implementations-architecture-1-title implementations-architecture-1-desc" font-family="Noto Sans KR, Arial, sans-serif"><title id="implementations-architecture-1-title">다섯 가지 decision model 구현의 입력·backbone·head·출력 비교</title><desc id="implementations-architecture-1-desc">같은 네 열로 다섯 구현을 비교한 개념도다. ①은 토큰 생성을 반복하고, ②는 답 위치에서 후보 토큰 점수를 읽는다. ③·④는 별도 head가 후보를 채점하며, ⑤는 두 갈래로 만든 임베딩을 비교한다. 빨강은 후보 점수를 계산하는 위치로, 새 학습이 필요한 부분을 뜻하지 않는다. 좁은 화면에서는 도식 안을 가로로 스크롤할 수 있다.</desc><rect width="920" height="802" fill="#fafaf8"/><defs><marker id="implementations-architecture-1-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#696961"/></marker></defs><text x="20" y="32" font-size="9" letter-spacing="1" fill="#777">FIVE PATHS</text><text x="150" y="32" font-size="10" letter-spacing="1" font-weight="700" fill="#444">INPUT</text><text x="340" y="32" font-size="10" letter-spacing="1" font-weight="700" fill="#444">BACKBONE</text><text x="530" y="32" font-size="10" letter-spacing="1" font-weight="700" fill="#444">HEAD / READOUT</text><text x="720" y="32" font-size="10" letter-spacing="1" font-weight="700" fill="#444">OUTPUT</text><path d="M20 50 H900" stroke="#c5c5bf"/><g><text x="20" y="111" font-size="14" font-weight="700" fill="#202020">① 문자열 생성</text><text x="20" y="132" font-size="10" fill="#777">포켓몬 Qwen</text><path d="M320 126 H335" fill="none" stroke="#696961" stroke-width="1.5" marker-end="url(#implementations-architecture-1-arrow)"/><path d="M510 126 H525" fill="none" stroke="#696961" stroke-width="1.5" marker-end="url(#implementations-architecture-1-arrow)"/><path d="M700 126 H715" fill="none" stroke="#696961" stroke-width="1.5" marker-end="url(#implementations-architecture-1-arrow)"/><g><rect x="150" y="84" width="170" height="84" fill="#202020" stroke="#202020"/><text x="162" y="101" font-size="8" letter-spacing=".8" fill="#ccc">INPUT</text><text x="162" y="123" font-size="14" font-weight="700" fill="#fff">상태 · 질문 · 후보</text><text x="162" y="143" font-size="10.5" fill="#ccc">목표와 행동 후보를 구성</text></g><g><rect x="340" y="84" width="170" height="84" fill="#e3dfed" stroke="#e3dfed"/><text x="352" y="101" font-size="8" letter-spacing=".8" fill="#756688">BACKBONE</text><text x="352" y="123" font-size="14" font-weight="700" fill="#3b3056">Decoder backbone</text><text x="352" y="143" font-size="10.5" fill="#756688">입력과 생성 토큰을 읽음</text></g><g><rect x="530" y="84" width="170" height="84" fill="#efefec" stroke="#c5c5bf"/><text x="542" y="101" font-size="8" letter-spacing=".8" fill="#686864">HEAD / READOUT</text><text x="542" y="123" font-size="14" font-weight="700" fill="#202020">기존 LM head</text><text x="542" y="143" font-size="10.5" fill="#686864">다음 토큰 점수</text><text x="542" y="157" font-size="10.5" fill="#686864">토큰 선택을 반복</text></g><g><rect x="720" y="84" width="170" height="84" fill="#efefec" stroke="#c5c5bf"/><text x="732" y="101" font-size="8" letter-spacing=".8" fill="#686864">OUTPUT</text><text x="732" y="123" font-size="14" font-weight="700" fill="#202020">JSON / 행동 이름</text><text x="732" y="143" font-size="10.5" fill="#686864">문자열을 완성한 뒤</text><text x="732" y="157" font-size="10.5" fill="#686864">파싱 · 후보 검증</text></g><path d="M615 168 V188 H425 V173" fill="none" stroke="#777" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#implementations-architecture-1-arrow)"/><text x="447" y="183" font-size="9" fill="#666">생성한 토큰을 다시 입력</text><path d="M20 198 H900" stroke="#deded7"/></g><g><text x="20" y="243" font-size="14" font-weight="700" fill="#202020">② 토큰 점수</text><text x="20" y="264" font-size="10" fill="#777">AnyJev · Nimble</text><path d="M320 258 H335" fill="none" stroke="#696961" stroke-width="1.5" marker-end="url(#implementations-architecture-1-arrow)"/><path d="M510 258 H525" fill="none" stroke="#696961" stroke-width="1.5" marker-end="url(#implementations-architecture-1-arrow)"/><path d="M700 258 H715" fill="none" stroke="#696961" stroke-width="1.5" marker-end="url(#implementations-architecture-1-arrow)"/><g><rect x="150" y="216" width="170" height="84" fill="#202020" stroke="#202020"/><text x="162" y="233" font-size="8" letter-spacing=".8" fill="#ccc">INPUT</text><text x="162" y="255" font-size="14" font-weight="700" fill="#fff">상태 · 질문 · 후보</text><text x="162" y="275" font-size="10.5" fill="#ccc">후보를 A · B · C로 대응</text></g><g><rect x="340" y="216" width="170" height="84" fill="#e3dfed" stroke="#e3dfed"/><text x="352" y="233" font-size="8" letter-spacing=".8" fill="#756688">BACKBONE</text><text x="352" y="255" font-size="14" font-weight="700" fill="#3b3056">Decoder backbone</text><text x="352" y="275" font-size="10.5" fill="#756688">답 위치의 hidden state</text></g><g><rect x="530" y="216" width="170" height="84" fill="#e33b27" stroke="#e33b27"/><text x="542" y="233" font-size="8" letter-spacing=".8" fill="#ffe4de">HEAD / READOUT</text><text x="542" y="255" font-size="14" font-weight="700" fill="#fff">LM head / readout</text><text x="542" y="275" font-size="10.5" fill="#ffe4de">후보 토큰의 logits 추출</text><text x="542" y="289" font-size="10.5" fill="#ffe4de">축소 readout도 가능</text></g><g><rect x="720" y="216" width="170" height="84" fill="#efefec" stroke="#c5c5bf"/><text x="732" y="233" font-size="8" letter-spacing=".8" fill="#686864">OUTPUT</text><text x="732" y="255" font-size="14" font-weight="700" fill="#202020">후보 확률 · 선택</text><text x="732" y="275" font-size="10.5" fill="#686864">후보 안에서 softmax</text><text x="732" y="289" font-size="10.5" fill="#686864">답 문자열 생성 생략</text></g><path d="M20 330 H900" stroke="#deded7"/></g><g><text x="20" y="375" font-size="14" font-weight="700" fill="#202020">③ 별도 head</text><text x="20" y="396" font-size="10" fill="#777">Kev · Clef</text><path d="M320 390 H335" fill="none" stroke="#696961" stroke-width="1.5" marker-end="url(#implementations-architecture-1-arrow)"/><path d="M510 390 H525" f