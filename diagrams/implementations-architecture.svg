<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 1052" role="img" aria-labelledby="implementations-architecture-1-title implementations-architecture-1-desc" font-family="Noto Sans KR, Arial, sans-serif"><title id="implementations-architecture-1-title">다섯 구현의 계산 경로와 학습 위치. MNIST는 ③ 별도 head</title><desc id="implementations-architecture-1-desc">위쪽 상자는 답을 계산하는 흐름, 아래 배지는 사용하거나 학습하는 부분이다. ①은 로컬 포켓몬, ③은 직접 학습한 MNIST 설정을 표시했다. ②·④·⑤는 완성된 모델을 사용하는 경우와 추가 학습을 선택하는 경우를 구분했다. 초록 배지는 학습, 회색 배지는 고정, 초록 테두리는 선택 사항이다. 학습데이터가 필요 없다는 말은 가중치를 그대로 사용한다는 뜻이며, 성능을 확인할 평가 자료는 따로 필요하다.</desc><rect width="920" height="1052" fill="#fafaf8"/><defs><marker id="implementations-architecture-1-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#696961"/></marker></defs><text x="20" y="32" font-size="9" letter-spacing="1" fill="#777">FIVE PATHS</text><text x="150" y="32" font-size="10" letter-spacing="1" font-weight="700" fill="#444">INPUT</text><text x="340" y="32" font-size="10" letter-spacing="1" font-weight="700" fill="#444">BACKBONE</text><text x="530" y="32" font-size="10" letter-spacing="1" font-weight="700" fill="#444">HEAD / READOUT</text><text x="720" y="32" font-size="10" letter-spacing="1" font-weight="700" fill="#444">OUTPUT</text><path d="M20 50 H900" stroke="#c5c5bf"/><g><text x="20" y="111" font-size="14" font-weight="700" fill="#202020">① 문자열 생성</text><text x="20" y="132" font-size="10" fill="#777">포켓몬 Qwen</text><path d="M320 126 H335" fill="none" stroke="#696961" stroke-width="1.5" marker-end="url(#implementations-architecture-1-arrow)"/><path d="M510 126 H525" fill="none" stroke="#696961" stroke-width="1.5" marker-end="url(#implementations-architecture-1-arrow)"/><path d="M700 126 H715" fill="none" stroke="#696961" stroke-width="1.5" marker-end="url(#implementations-architecture-1-arrow)"/><g><rect x="150" y="84" width="170" height="84" fill="#202020" stroke="#202020"/><text x="162" y="101" font-size="8" letter-spacing=".8" fill="#ccc">INPUT</text><text x="162" y="123" font-size="14" font-weight="700" fill="#fff">상태 · 질문 · 후보</text><text x="162" y="143" font-size="10.5" fill="#ccc">목표와 행동 후보를 구성</text></g><g><rect x="340" y="84" width="170" height="84" fill="#e3dfed" stroke="#e3dfed"/><text x="352" y="101" font-size="8" letter-spacing=".8" fill="#756688">BACKBONE</text><text x="352" y="123" font-size="14" font-weight="700" fill="#3b3056">생성 모델 본체</text><text x="352" y="143" font-size="10.5" fill="#756688">Qwen의 입력 표현 계산</text></g><g><rect x="530" y="84" width="170" height="84" fill="#efefec" stroke="#c5c5bf"/><text x="542" y="101" font-size="8" letter-spacing=".8" fill="#686864">HEAD / READOUT</text><text x="542" y="123" font-size="14" font-weight="700" fill="#202020">기존 LM head</text><text x="542" y="143" font-size="10.5" fill="#686864">다음 토큰 점수</text><text x="542" y="157" font-size="10.5" fill="#686864">토큰 선택을 반복</text></g><g><rect x="720" y="84" width="170" height="84" fill="#efefec" stroke="#c5c5bf"/><text x="732" y="101" font-size="8" letter-spacing=".8" fill="#686864">OUTPUT</text><text x="732" y="123" font-size="14" font-weight="700" fill="#202020">JSON / 행동 이름</text><text x="732" y="143" font-size="10.5" fill="#686864">문자열을 완성한 뒤</text><text x="732" y="157" font-size="10.5" fill="#686864">파싱 · 후보 검증</text></g><path d="M615 168 V188 H425 V173" fill="none" stroke="#777" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#implementations-architecture-1-arrow)"/><text x="447" y="183" font-size="9" fill="#666">생성한 토큰을 다시 입력</text><text x="20" y="217" font-size="10" fill="#777">사용 · 추가 학습</text><g><rect x="340" y="202" width="170" height="24" fill="#efefec" stroke="#c5c5bf" /><text x="425" y="218" text-anchor="middle" font-size="9.5" font-weight="500" fill="#555">기반 고정</text></g><g><rect x="530" y="202" width="170" height="24" fill="#efefec" stroke="#c5c5bf" /><text x="615" y="218" text-anchor="middle" font-size="9.5" font-weight="500"